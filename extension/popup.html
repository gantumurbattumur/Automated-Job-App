<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { width: 300px; margin: 0; font: 13px/1.45 system-ui, sans-serif; color: #16181d; background: #fff; }
  @media (prefers-color-scheme: dark) { body { background: #171a21; color: #e7e9ee; } input { background: #1c2029; color: #e7e9ee; } }
  .wrap { padding: 14px; } h1 { font-size: 15px; margin: 0 0 8px; } .mut { color: #667085; } .ok { color: #15803d; } .bad { color: #b42318; }
  button, input { font: inherit; } input { width: 100%; padding: 5px 7px; border: 1px solid #d0d5dd; border-radius: 6px; box-sizing: border-box; }
  button { border: 1px solid #2563eb; background: #2563eb; color: #fff; border-radius: 6px; padding: 6px 10px; cursor: pointer; margin-top: 8px; width: 100%; }
  button.ghost { background: none; color: #2563eb; } label { display: block; margin-top: 10px; font-size: 12px; color: #667085; }
</style></head>
<body><div class="wrap">
  <h1>JobPrep Autofill</h1>
  <div id="status" class="mut">Checking connection…</div>
  <button id="inject">Show Autofill on this page</button>
  <button id="open" class="ghost">Open JobPrep dashboard</button>
  <label>JobPrep address<input id="api" placeholder="http://127.0.0.1:8000"></label>
  <p class="mut" style="font-size:11px;margin:10px 0 0">Fills forms from your local profile. Talks only to JobPrep on this computer. Never submits.</p>
</div><script src="popup.js"></script></body></html>
