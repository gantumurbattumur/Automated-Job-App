<!doctype html><html><head><meta charset="utf-8"><title>Software Engineering Intern - Acme AI</title>
<meta property="og:site_name" content="Acme AI"></head>
<body><h1>Software Engineering Intern</h1>
<form id="app" onsubmit="window.submitted = true; return false;">
  <label for="first_name">First Name *</label><input id="first_name" required>
  <label for="last_name">Last Name *</label><input id="last_name" required>
  <label for="email">Email *</label><input id="email" type="email" required>
  <label for="phone">Phone</label><input id="phone" type="tel">
  <label for="li">LinkedIn Profile</label><input id="li">
  <label for="school">School *</label><input id="school" required>
  <label for="degree">Degree *</label>
  <select id="degree" required><option value="">Select…</option><option value="ba">Bachelor's Degree</option>
    <option value="ms">Master's Degree</option><option value="mba">Master of Business Administration (M.B.A.)</option></select>
  <label for="resume">Resume/CV *</label><input id="resume" type="file" required>
  <fieldset><legend>Will you now or in the future require sponsorship for employment visa status? *</legend>
    <label><input type="radio" name="spons" value="y" required> Yes</label><label><input type="radio" name="spons" value="n"> No</label></fieldset>
  <fieldset><legend>Are you legally authorized to work in the United States? *</legend>
    <label><input type="radio" name="auth" value="y" required> Yes</label><label><input type="radio" name="auth" value="n"> No</label></fieldset>
  <!-- Workday-style dropdown: a button that opens a listbox -->
  <label id="gender-l">Gender</label>
  <button type="button" id="gender" aria-haspopup="listbox" aria-labelledby="gender-l">Select One</button>
  <ul role="listbox" id="gender-list" style="display:none">
    <li role="option">Male</li><li role="option">Female</li><li role="option">I do not wish to self-identify</li></ul>
  <label for="why">Why do you want to work at Acme AI?</label><textarea id="why"></textarea>
  <label for="ref">Who referred you? *</label><input id="ref" required>
  <button type="submit">Submit application</button>
</form>
<script>
  const g = document.getElementById('gender'), list = document.getElementById('gender-list');
  g.addEventListener('click', () => { list.style.display = 'block'; });
  list.querySelectorAll('[role=option]').forEach(o => o.addEventListener('click', () => { g.textContent = o.textContent; list.style.display = 'none'; }));
</script></body></html>
