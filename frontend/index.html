<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JobPrep</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="logo">J</span>JobPrep</div>
    <div class="status grow" id="srcStatus"></div>
    <span id="refreshMsg" class="small mut"></span>
    <button class="btn" id="refreshBtn" title="Fetch new postings from every source now">↻ Refresh</button>
  </header>

  <nav class="nav" id="nav">
    <button data-page="home"><span class="ico">⌂</span>Home</button>
    <button data-page="jobs"><span class="ico">☰</span>Jobs</button>
    <button data-page="tracker"><span class="ico">▦</span>Tracker<span class="count hidden" id="inboxCount" title="Job emails to review"></span></button>
    <button data-page="tailor"><span class="ico">✎</span>Tailor</button>
    <button data-page="settings"><span class="ico">⚙</span>Settings</button>
    <div class="sep"></div>
    <div class="foot">Local &amp; free · data stays on this Mac</div>
  </nav>

  <main class="main" id="main">
    <section id="page-home"></section>
    <section id="page-jobs" class="hidden">
      <div class="searchbar">
        <label class="sb-in"><span class="sb-ico">🔍</span><input type="text" id="q" placeholder="Search title or company"></label>
        <div class="sb-in" id="nearbox"></div>
      </div>
      <div class="pills" id="quickbar"></div>
      <div class="jobs2">
        <div class="results">
          <div class="row between small mut res-hd"><span id="counts"></span>
            <label class="row" style="gap:6px">Sort <select id="sort" class="pill" title="Sort">
              <option value="score">Best match</option><option value="new">Newest</option>
              <option value="relevance">Resume match</option><option value="deadline">Deadline soonest</option><option value="nearest">Nearest</option>
            </select></label></div>
          <div class="list" id="list" tabindex="0"></div>
        </div>
        <div class="detail" id="detail"></div>
      </div>
      <div class="drawer hidden" id="drawer">
        <div class="row between drawer-hd"><b>All filters</b><button class="btn sm ghost" id="drawerClose">✕ Close</button></div>
        <label class="check small" style="margin:0 0 10px"><input type="checkbox" id="showHidden"> Show hidden jobs too (with the reason)</label>
        <aside class="filters" id="filters"></aside>
      </div>
    </section>
    <section id="page-tracker" class="hidden"></section>
    <section id="page-inbox" class="hidden"></section>
    <section id="page-resumes" class="hidden"></section>
    <section id="page-tailor" class="hidden"></section>
    <section id="page-settings" class="hidden"></section>
  </main>
</div>

<dialog id="askDialog">
  <h2 id="askTitle">Did you apply?</h2>
  <p class="mut" id="askBody"></p>
  <div class="row">
    <button class="btn primary" data-answer="applied">Yes, I applied</button>
    <button class="btn" data-answer="opened">Not yet</button>
    <button class="btn" data-answer="dismissed">Not interested</button>
  </div>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
